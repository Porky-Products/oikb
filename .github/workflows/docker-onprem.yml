name: Docker (On-Prem Registry)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-onprem-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.ONPREM_DOCKER_REGISTRY }}
  IMAGE_REPOSITORY: ${{ vars.ONPREM_DOCKER_IMAGE_REPOSITORY }}
  IMAGE: ${{ vars.ONPREM_DOCKER_REGISTRY }}/${{ vars.ONPREM_DOCKER_IMAGE_REPOSITORY }}

permissions:
  contents: read

jobs:
  validate-config:
    environment: localdocker
    runs-on:
      group: onprem
      labels: [self-hosted, Linux, X64]
    steps:
      - name: Validate registry configuration
        env:
          REGISTRY_USERNAME: ${{ secrets.ONPREM_DOCKER_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.ONPREM_DOCKER_PASSWORD }}
          UPDATE_WEBHOOK: ${{ secrets.UPDATE_WEBHOOK }}
        run: |
          set -euo pipefail

          missing=0
          for var in REGISTRY IMAGE_REPOSITORY REGISTRY_USERNAME REGISTRY_PASSWORD UPDATE_WEBHOOK; do
            if [ -z "${!var:-}" ]; then
              echo "Missing required workflow configuration: $var" >&2
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

  read-version:
    needs: validate-config
    environment: localdocker
    runs-on:
      group: onprem
      labels: [self-hosted, Linux, X64]
    outputs:
      version: ${{ steps.pkg.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: pkg
        run: |
          VERSION=$(python3 -c "
          import re, pathlib
          text = pathlib.Path('pyproject.toml').read_text()
          m = re.search(r'^version\s*=\s*\"([^\"]+)\"', text, re.M)
          print(m.group(1))
          ")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build-release:
    needs: read-version
    environment: localdocker
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    runs-on:
      group: onprem
      labels: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build cache refs
        id: cache
        run: |
          set -euo pipefail
          branch="$(printf '%s' "${GITHUB_REF_NAME:-main}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')"
          if [ "${#branch}" -gt 100 ]; then
            branch="${branch:0:83}-$(printf '%s' "$branch" | sha256sum | cut -c1-16)"
          fi
          if [ "$branch" = "main" ]; then
            fallback="develop"
          else
            fallback="main"
          fi
          echo "primary=${{ env.IMAGE }}:buildcache-${branch}-default" >> "$GITHUB_OUTPUT"
          echo "fallback=${{ env.IMAGE }}:buildcache-${fallback}-default" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Unique builder name per job so parallel jobs on the same host don't
          # share a BuildKit daemon, which causes EOF/transport errors.
          name: builder-${{ github.run_id }}-default-amd64

      - name: Log in to on-prem registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ONPREM_DOCKER_USERNAME }}
          password: ${{ secrets.ONPREM_DOCKER_PASSWORD }}

      - name: Build and push linux/amd64 release image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=registry,ref=${{ steps.cache.outputs.primary }}
            type=registry,ref=${{ steps.cache.outputs.fallback }}
          cache-to: type=registry,ref=${{ steps.cache.outputs.primary }},mode=max,oci-mediatypes=true,image-manifest=true

  build-release-alpine:
    needs: read-version
    environment: localdocker
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    runs-on:
      group: onprem
      labels: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build cache refs
        id: cache
        run: |
          set -euo pipefail
          branch="$(printf '%s' "${GITHUB_REF_NAME:-main}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')"
          if [ "${#branch}" -gt 100 ]; then
            branch="${branch:0:83}-$(printf '%s' "$branch" | sha256sum | cut -c1-16)"
          fi
          if [ "$branch" = "main" ]; then
            fallback="develop"
          else
            fallback="main"
          fi
          echo "primary=${{ env.IMAGE }}:buildcache-${branch}-alpine" >> "$GITHUB_OUTPUT"
          echo "fallback=${{ env.IMAGE }}:buildcache-${fallback}-alpine" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Unique builder name per job so parallel jobs on the same host don't
          # share a BuildKit daemon, which causes EOF/transport errors.
          name: builder-${{ github.run_id }}-alpine-amd64

      - name: Log in to on-prem registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ONPREM_DOCKER_USERNAME }}
          password: ${{ secrets.ONPREM_DOCKER_PASSWORD }}

      - name: Build and push linux/amd64 Alpine release image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.alpine
          platforms: linux/amd64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=registry,ref=${{ steps.cache.outputs.primary }}
            type=registry,ref=${{ steps.cache.outputs.fallback }}
          cache-to: type=registry,ref=${{ steps.cache.outputs.primary }},mode=max,oci-mediatypes=true,image-manifest=true

  merge-release:
    needs: [read-version, build-release]
    environment: localdocker
    runs-on:
      group: onprem
      labels: [self-hosted, Linux, X64]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to on-prem registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ONPREM_DOCKER_USERNAME }}
          password: ${{ secrets.ONPREM_DOCKER_PASSWORD }}

      - name: Create release multi-arch manifest
        env:
          DIGEST_AMD64: ${{ needs.build-release.outputs.digest }}
        run: |
          VERSION="${{ needs.read-version.outputs.version }}"
          MAJOR_MINOR="${VERSION%.*}"
          tags=("${{ env.IMAGE }}:latest" "${{ env.IMAGE }}:${VERSION}" "${{ env.IMAGE }}:${MAJOR_MINOR}")
          digests=("${{ env.IMAGE }}@${DIGEST_AMD64}")
          docker buildx imagetools create $(printf -- '-t %s ' "${tags[@]}") \
            "${digests[@]}"

  merge-release-alpine:
    needs: [read-version, build-release-alpine]
    environment: localdocker
    runs-on:
      group: onprem
      labels: [self-hosted, Linux, X64]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to on-prem registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ONPREM_DOCKER_USERNAME }}
          password: ${{ secrets.ONPREM_DOCKER_PASSWORD }}

      - name: Create release Alpine multi-arch manifest
        env:
          DIGEST_AMD64: ${{ needs.build-release-alpine.outputs.digest }}
        run: |
          VERSION="${{ needs.read-version.outputs.version }}"
          MAJOR_MINOR="${VERSION%.*}"
          tags=("${{ env.IMAGE }}:alpine" "${{ env.IMAGE }}:latest-alpine" "${{ env.IMAGE }}:${VERSION}-alpine" "${{ env.IMAGE }}:${MAJOR_MINOR}-alpine")
          digests=("${{ env.IMAGE }}@${DIGEST_AMD64}")
          docker buildx imagetools create $(printf -- '-t %s ' "${tags[@]}") \
            "${digests[@]}"

  update-stack:
    needs: [merge-release, merge-release-alpine]
    environment: localdocker
    runs-on:
      group: onprem
      labels: [self-hosted, Linux, X64]
    steps:
      - name: Trigger stack update webhook
        env:
          UPDATE_WEBHOOK: ${{ secrets.UPDATE_WEBHOOK }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -X POST "$UPDATE_WEBHOOK" -k >/dev/null
